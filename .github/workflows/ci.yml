# Runs the project's five checks (Formatting, Lint, Typecheck, Tests,
# Build) on pull requests. `npm run check` runs the same commands locally,
# one after another.
#
# Pull requests only: each run tests the result of merging the PR into its
# base branch (the latest main), which is what the main ruleset requires to
# pass before merging. Pushing a branch without a PR runs nothing, so run
# `npm run check` locally before pushing.
#
# No Supabase keys here on purpose: the secret key bypasses Row Level
# Security, so it stays only in .env.local and Supabase. The live database
# check (`npm run check:supabase`) is run by hand after migrations.

name: CI

on:
  pull_request:

# Read-only access to the repository is all the checks need.
permissions:
  contents: read

# A newer push to a pull request's branch cancels its older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per check, all running at the same time on separate machines.
  # Each shows up on pull requests as its own check, and the ruleset on
  # main requires all five by these names, so keep them in sync if renamed.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let every check finish even if one fails, so each shows its real
      # result instead of "cancelled".
      fail-fast: false
      matrix:
        include:
          - name: Formatting
            command: npm run format:check
          - name: Lint
            command: npm run lint
          - name: Typecheck
            command: npm run typecheck
          - name: Tests
            command: npm test
          - name: Build
            command: npm run build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
