# Runs the project's checks on pull requests: Prettier, ESLint, Unit Tests,
# Guard Tests, Build, and E2E Tests. `npm run check` runs the first five
# locally, one after another; `npm run test:e2e` runs the last. There's no
# separate typecheck: `next build` type-checks every file in tsconfig,
# including tests and scripts.
#
# Guard tests are files named *.guard.test.ts (project rules: profile check
# on every page, theme colors, schema permissions); everything else is a
# unit test.
#
# Pull requests only: each run tests the result of merging the PR into its
# base branch (the latest main), which is what the main ruleset requires to
# pass before merging. Pushing a branch without a PR runs nothing, so run
# `npm run check` locally before pushing.
#
# Supabase keys: only the E2E Tests job gets them (from GitHub Secrets), because
# it runs the real app against the real database. The secret key bypasses Row
# Level Security, so no other job sees it. GitHub doesn't give secrets to pull
# requests from forks, so E2E Tests fails on those. The live database check
# (`npm run check:supabase`) is still run by hand after migrations.

name: CI

on:
  pull_request:

# Read-only access to the repository is all the checks need.
permissions:
  contents: read

# A newer push to a pull request's branch cancels its older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per check, all running at the same time on separate machines.
  # Each shows up on pull requests as its own check, and the ruleset on
  # main requires all five by these names, so keep them in sync if renamed.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let every check finish even if one fails, so each shows its real
      # result instead of "cancelled".
      fail-fast: false
      matrix:
        include:
          - name: Prettier
            command: npm run format:check
          - name: ESLint
            command: npm run lint
          - name: Unit Tests
            command: npm run test:unit
          - name: Guard Tests
            command: npm run test:guard
          - name: Build
            command: npm run build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  # End-to-end tests: Playwright drives a production build of the app in
  # Chromium. Each test creates its own +test account and deletes it after;
  # .github/workflows/e2e-cleanup.yml removes any left behind by a crash.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      E2E_EMAIL_BASE: ${{ secrets.E2E_EMAIL_BASE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # No report or trace is uploaded: artifacts on a public repo can be
      # downloaded by anyone, and traces contain the test account's address.
      - name: E2E Tests
        run: npm run test:e2e
