# Runs the project's checks on every push, to any branch.
# Same steps as `npm run check` locally.
#
# No Supabase keys here on purpose: the secret key bypasses Row Level
# Security, so it stays only in .env.local and Supabase. The live database
# check (`npm run check:supabase`) is run by hand after migrations.

name: CI

on:
  push:

# Read-only access to the repository is all the checks need.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fastest first, so a simple mistake fails the run quickly.
      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
